[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "satellite-discovery"
version = "0.3.0"
description = "Public sequencing retrieval, QC and descriptive artifact reviews"
requires-python = ">=3.11"
dependencies = ["cryptography>=44,<51"]

[project.scripts]
satellite-discovery = "satellite_discovery.cli:main"
satellite-reviews = "satellite_discovery.review_ui:main"
satellite-m17 = "satellite_discovery.m17_workflow:main"
satellite-m18 = "satellite_discovery.m18_workflow:main"
satellite-m19 = "satellite_discovery.m19_benchmark:main"
satellite-controlled-fastq = "satellite_discovery.controlled_fastq_acquisition:main"
satellite-controlled-exploratory-fastq = "satellite_discovery.trusted_single_run_acquisition:main"
satellite-m21-readiness = "satellite_discovery.m21_benchmark_readiness:main"

[tool.setuptools.packages.find]
include = ["satellite_discovery*"]

[tool.setuptools.package-data]
satellite_discovery = [
    "helpers.json",
    "model_scope.json",
    "public_virus_policy.json",
    "public_virus_exploratory_intake_policy.json",
    "m12_legacy_cache_compatibility.txt",
    "m5_execution_outcome_cache_compatibility.txt",
    "stage_cache_identity_compatibility.txt",
    "m21_benchmark_manifest.schema.json",
    "m21_reference_panel_manifest.schema.json",
    "m21_reviewer_trust_store.schema.json",
    "m21_control_qualification.schema.json",
    "m21_phase5_reference_exclusion_policy.schema.json",
    "m21_phase5_control_eligibility.schema.json",
    "m21_phase5_truth_bundle.schema.json",
    "m21_phase5_scoring_policy.schema.json",
]

[project.optional-dependencies]
alignment = ["pysam==0.24.1"]
plots = ["matplotlib>=3.8,<4"]
