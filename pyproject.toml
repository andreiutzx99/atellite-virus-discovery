[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "satellite-discovery"
version = "0.3.0"
description = "Public sequencing retrieval, QC and descriptive artifact reviews"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
satellite-discovery = "satellite_discovery.cli:main"

[tool.setuptools.packages.find]
include = ["satellite_discovery*"]

[tool.setuptools.package-data]
satellite_discovery = ["helpers.json", "model_scope.json"]
