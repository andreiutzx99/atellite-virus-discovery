name: tests
on: [push, pull_request]
jobs:
  offline-tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - run: satellite-reviews --help
      - run: python -I scripts/check_installed.py
      - if: runner.os == 'Linux'
        run: sh Run-reviews.sh --help
      - run: python -m unittest discover -s tests -v

  optional-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: "python -m pip install --only-binary=:all: pysam==0.24.1 matplotlib==3.10.1"
      - run: sudo apt-get update && sudo apt-get install -y samtools ncbi-blast+
      - run: python -m unittest discover -s tests -v
        env:
          RUN_OPTIONAL_TOOL_TESTS: '1'
