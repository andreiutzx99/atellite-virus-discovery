name: tests
on: [push, pull_request]
jobs:
  offline-tests:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install .
      - run: satellite-reviews --help
      - run: python -I scripts/check_installed.py
      - if: runner.os == 'Linux'
        run: sh Run-reviews.sh --help
      - run: python -m unittest discover -s tests -v

  optional-tools:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: "python -m pip install --only-binary=:all: pysam==0.24.1 matplotlib==3.10.1 numpy==2.2.6"
      - run: sudo apt-get update && sudo apt-get install -y samtools ncbi-blast+ spades minimap2
      - run: python scripts/check_minimap2_ci.py
      - run: python scripts/check_tadpole_ci.py
      - run: python scripts/check_spades_ci.py
      - run: python scripts/check_virema_ci.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: artificial-virema-evidence
          path: .tools/virema-diagnostic-*/
          include-hidden-files: true
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: artificial-spades-evidence
          path: .tools/spades-diagnostic-*/
          include-hidden-files: true
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: artificial-minimap2-evidence
          path: .tools/m6-minimap2-diagnostic/
          include-hidden-files: true
          retention-days: 14
      - run: python -m unittest discover -s tests -v
        env:
          RUN_OPTIONAL_TOOL_TESTS: '1'
